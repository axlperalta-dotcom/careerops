name: Reportar un problema
description: Cuenta qué ocurrió al probar CareerOps.
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: ¿Qué hiciste?
      description: Pantalla y pasos para repetir el problema.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ¿Qué esperabas?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: ¿Qué ocurrió?
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impacto
      options:
        - Me bloquea
        - Me dificulta
        - Detalle visual
  - type: textarea
    id: evidence
    attributes:
      label: Captura o detalles adicionales
      description: Evita incluir datos privados o credenciales.
